project:
  name: "RadioDiff-3D-PL-Random10"
  seed: 42

data:
  train_dir: "D:/datas/processed_pl_aff_dataset/train"
  val_dir: "D:/datas/processed_pl_aff_dataset/val"
  test_dir: "D:/datas/processed_pl_aff_dataset/test"
  building_dir: "E:/datas/RM_Data/Building_Infomation/buildings"
  image_size: 256
  altitudes: [1.0, 2.0, 3.0, 4.0]
  val_fraction: 0.10
  max_building_height: 20.0
  manifest_dir: "cache/manifests"
  use_sampling: true
  sample_rate: 0.10
  sampling_mode: "random"
  deterministic_sampling_for_eval: true
  num_workers: 0
  pin_memory: true

model:
  in_channels: 1
  condition_channels: 4
  out_channels: 1
  base_channels: 16
  time_dim: 128
  attention_heads: 4

diffusion:
  timesteps: 200
  beta_schedule: "linear"
  beta_start: 0.0005
  beta_end: 0.10
  cosine_s: 0.008
  ddim_steps: 200
  ddim_eta: 0.0
  clip_denoised: true

train:
  epochs: 10
  batch_size: 2
  learning_rate: 0.00005
  weight_decay: 0.0
  loss: "l1"
  amp: true
  ema_decay: 0.995
  ema_update_every: 10
  grad_clip: 1.0
  log_every: 100
  output_dir: "outputs/radiodiff3d_pl_random10"
  max_train_steps_per_epoch: 0
  max_val_steps_per_epoch: 0

eval:
  batch_size: 1
  max_volumes: 0
  save_first_n: 5
  measurement_consistency: "projection_final"
  output_dir: "outputs/radiodiff3d_pl_random10/eval_results"
