task_name: "pathloss_idw_random10"
seed: 42

data:
  train_dir: "D:/datas/processed_pl_aff_dataset/train"
  val_dir: "D:/datas/processed_pl_aff_dataset/val"
  test_dir: "D:/datas/processed_pl_aff_dataset/test"
  building_dir: "D:/zdata/Building_Infomation/buildings"
  image_size: 256
  max_building_height: 20.0
  use_sampling: true
  sampling_mode: "random"
  sample_rate: 0.10
  deterministic_sampling_for_eval: true
  verify_files: false
  num_workers: 0
  pin_memory: false
  persistent_workers: false

model:
  method: "idw"
  k_neighbors: 8
  power: 2.0
  eps: 1.0e-8

eval:
  batch_size: 1
  save_first_n: 20
  enforce_measurement_consistency: true
  clip_output: true
  save_dir: "outputs/pathloss_idw_random10/eval_results"

checkpoint:
  save_dir: "outputs/pathloss_idw_random10/checkpoints"

logging:
  log_dir: "outputs/pathloss_idw_random10/logs"
